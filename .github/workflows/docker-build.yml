name: Docker Build & Push

on:
  workflow_run:
    workflows: [ "CI Pipeline" ]
    types: [ completed ]
    branches: [ "main" ]

permissions:
  contents: read
  actions: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download Application JAR
        uses: actions/download-artifact@v7.0.0
        with:
          name: application-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to DockerHub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/safepet-backend
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64   # aggiungi arm64 solo se serve davvero
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          # cache-to: type=gha, mode=max # Salvataggio di tutti i layer dell'immagine nella cache di GitHub Actions
          # cache-from: type=gha # Se un layer non è cambiato, viene riusato invece di essere rieseguito
