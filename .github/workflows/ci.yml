name: CI Pipeline

on:
  push:
    branches:
    - "main"
  pull_request:
    branches:
    - "main"

# Least Privilege
permissions:
  contents: read

jobs:
  build:
    name: Build & Verify Maven Project
    runs-on: ubuntu-latest

    steps:
      # Checkout del codice sorgente
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      # Setup di Java
      - name: Setup JDK 21
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Build, checkstyle in fase di validate e test
      - name: Build, Checkstyle & Test
        run: mvn -B -ntp clean verify

      # Salva il report dei tests
      - name: Upload test results
        uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: test-report
          path: target/surefire-reports/

      # Generazione e salvataggio report Checkstyle
      - name: Generate Checkstyle Report
        if: always()
        run: mvn -B -ntp checkstyle:checkstyle

      - name: Upload Checkstyle Report
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: checkstyle-report
          path: target/site/checkstyle.html
          if-no-files-found: ignore

      # Salvataggio del .jar ottenuto dalla build nel cloud Github
      - name: Upload Application JAR
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: application-${{ github.sha }}
          path: target/backend.jar
          if-no-files-found: error
          retention-days: 7