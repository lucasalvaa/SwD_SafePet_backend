name: CI Pipeline

# 1. Cambio del nome (opzionale)
# 2. Disaccoppiamento Ci e CD in due workflows
# 3. Rimozione vecchio branch di test della CI
# 4. Least Privilege
# 5. Update delle actions all'ultima versione
# 6. Unico comando mvn con fase di verify e modifiche al pom.xml
# 6.1 Aggiornamento checkstyle e modifica alla phase
# 6.2 Aggiornamento spring boot 3.5.12
# 6.3 Aggiornamento openhtmltopdf e jjwt aggiungendo la properties per aumentare la consistenza
# 7. Salvataggio del jar -> Build once, deploy many

on:
  push:
    branches:
    - "main"
  pull_request:
    branches:
    - "main"

# Least Privilege
permissions:
  contents: read

jobs:
  build:
    name: Build & Verify Maven Project
    runs-on: ubuntu-latest

    steps:
      # Checkout del codice sorgente
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      # Setup di Java
      - name: Setup JDK 21
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Build, checkstyle in fase di validate e test
      - name: Build, Checkstyle & Test
        run: mvn -B -ntp clean verify

      # Generazione e salvataggio report Checkstyle
      - name: Generate Checkstyle Report
        if: always()
        run: mvn -B -ntp checkstyle:checkstyle

      - name: Upload Checkstyle Report
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: checkstyle-report
          path: target/site/checkstyle.html
          if-no-files-found: ignore

      # Salvataggio del .jar ottenuto dalla build nel cloud Github
      - name: Upload Application JAR
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: application-${{ github.sha }}
          path: target/backend.jar
          if-no-files-found: error
          retention-days: 7